<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 260" role="presentation">
  <!-- Strzala na cala dlugosc przekatnej strony, z pilka wpisana
       w 72 procentach jej dlugosci. Drzewce rysujemy pierwsze, pilka
       zaslania je w srodku, wiec czyta sie to jako przebicie.
       Grafika jest pozioma; skos daje jej dopiero obrot w CSS,
       inny dla ekranu szerokiego i dla telefonu. -->

  <defs>
    <clipPath id="ballDiag">
      <circle cx="1440" cy="130" r="105"/>
    </clipPath>
  </defs>

  <g fill="none" stroke="#f2a7ba" stroke-linecap="round" stroke-linejoin="round">
    <!-- drzewce -->
    <path d="M40 130H1940" stroke-width="18"/>
    <!-- lotki -->
    <path d="M30 96 92 130 30 164" stroke-width="15"/>
    <path d="M86 101 136 130 86 159" stroke-width="15"/>
  </g>

  <!-- grot w formie serca -->
  <g transform="translate(1958 130) rotate(-90)">
    <path d="M0 42C-47 9-52-26-27-38-9-46 0-32 0-24 0-32 9-46 27-38 52-26 47 9 0 42Z"
          fill="#f2a7ba"/>
  </g>

  <!-- pilka -->
  <circle cx="1440" cy="130" r="105" fill="#c9dd85"/>

  <!-- szwy, przyciete do okregu, nie przecinaja sie -->
  <g clip-path="url(#ballDiag)" fill="none" stroke="#f7f5ef"
     stroke-width="17" stroke-linecap="butt">
    <path d="M1357.6 64.9Q1440 138.3 1522.4 64.9"/>
    <path d="M1357.6 195.1Q1440 121.7 1522.4 195.1"/>
  </g>
</svg>
