<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 260" role="presentation">
  <!-- Strzala na cala przekatna strony, z pilka wpisana w 72 procentach
       jej dlugosci. Drzewce rysowane pierwsze, pilka zaslania je
       w srodku, wiec czyta sie to jako przebicie.
       Grafika jest pozioma, skos daje jej obrot w CSS strony.
       Animacja siedzi w tym pliku, wiec dziala takze wtedy, gdy SVG
       jest wstawiony przez <img>. Pilka stoi w miejscu. -->

  <style>
    .drzewce{
      stroke-dasharray:1920;
      stroke-dashoffset:1920;
      animation:rysuj 1.15s cubic-bezier(.22,.7,.25,1) .15s forwards;
    }
    .lotki{ opacity:0; animation:wejdz .35s ease-out .5s forwards; }

    @keyframes rysuj{ to{ stroke-dashoffset:0; } }
    @keyframes wejdz{ to{ opacity:1; } }

    @media (prefers-reduced-motion:reduce){
      .drzewce{ stroke-dashoffset:0; animation:none; }
      .lotki{ opacity:1; animation:none; }
    }
  </style>

  <defs>
    <clipPath id="ballDiag">
      <circle cx="1440" cy="130" r="92"/>
    </clipPath>
  </defs>

  <g fill="none" stroke="#f2a7ba" stroke-opacity="1" stroke-linecap="round" stroke-linejoin="round">
    <path class="drzewce" d="M34 130H1950" stroke-width="7"/>
    <g class="lotki" stroke-width="7">
      <path d="M26 100 80 130 26 160"/>
      <path d="M74 105 118 130 74 155"/>
    </g>
  </g>


  <circle cx="1440" cy="130" r="92" fill="#c9dd85"/>

  <g clip-path="url(#ballDiag)" fill="none" stroke="#f7f5ef"
     stroke-width="13" stroke-linecap="butt">
    <path d="M1367.8 73Q1440 137.4 1512.2 73"/>
    <path d="M1367.8 187Q1440 122.6 1512.2 187"/>
  </g>
</svg>
