<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" role="presentation">
  <!-- Strzala Amora z przerwa w srodku: przez te przerwe widac pilke,
       ktora lezy pod spodem, wiec czyta sie to jako przebicie. -->
  <g stroke="#f5f3ec" stroke-width="6.5" stroke-linecap="round" fill="none">
    <!-- drzewce, lewy odcinek -->
    <path d="M34 30H74"/>
    <!-- drzewce, prawy odcinek -->
    <path d="M166 30H194"/>
  </g>

  <!-- lotki -->
  <g stroke="#f5f3ec" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M6 14 30 30 6 46"/>
    <path d="M24 19 43 30 24 41"/>
  </g>

  <!-- grot w formie serca -->
  <g transform="translate(210 30) rotate(-90)">
    <path d="M0 16C-20 3-22-13-11-19-3.5-22 0-16 0-11 0-16 3.5-22 11-19 22-13 20 3 0 16Z"
          fill="#c2653f" stroke="#f5f3ec" stroke-width="2.4"/>
  </g>
</svg>
