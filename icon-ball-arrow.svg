<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="Piłka tenisowa przebita strzałą Amora">
  <!-- lot strzaly: drzewce za pilka -->
  <g stroke="#c2653f" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M4.5 35.5 12.0 27.4"/>
    <path d="M28.0 12.6 34.0 6.1"/>
    <!-- lotki -->
    <path d="M2.2 29.6 7.4 33.6 3.6 38.4" stroke-width="1.9"/>
  </g>

  <!-- pilka tenisowa -->
  <circle cx="20" cy="20" r="10.2" fill="#d9e565" stroke="#1b2016" stroke-width="1.7"/>
  <!-- szwy -->
  <path d="M11.7 14.1a11.6 11.6 0 0 1 6.0 11.5" fill="none" stroke="#1b2016" stroke-width="1.4" stroke-linecap="round" opacity=".75"/>
  <path d="M28.3 25.9a11.6 11.6 0 0 1-6.0-11.5" fill="none" stroke="#1b2016" stroke-width="1.4" stroke-linecap="round" opacity=".75"/>

  <!-- grot w formie serca -->
  <g transform="translate(35.2 5.0) rotate(45)">
    <path d="M0 6.4C-7.6 1.6-8.6-4.4-4.2-6.6-1.4-8-0-5.6 0-3.8 0-5.6 1.4-8 4.2-6.6 8.6-4.4 7.6 1.6 0 6.4Z" fill="#c2653f"/>
  </g>
</svg>
