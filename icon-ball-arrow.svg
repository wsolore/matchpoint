    <path d="M6 100H234"/>
    <path d="M206 74 234 100 206 126"/>
    <path d="M12 78 40 100 12 122" stroke-width="11"/>
  </g>

  <circle cx="120" cy="100" r="76" fill="#d9e565"/>

