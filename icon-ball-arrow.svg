<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="Piłka tenisowa przebita strzałą">
  <!-- Ta sama konstrukcja co znak w hero, ale zwarta i w mocniejszym
       kontrascie, zeby czytala sie przy 20 pikselach. -->

  <defs>
    <clipPath id="ballIco">
      <circle cx="120" cy="100" r="76"/>
    </clipPath>
  </defs>

  <g transform="rotate(-30 120 100)" fill="none" stroke="#c2653f"
